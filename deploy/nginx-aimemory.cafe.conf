# =========================================================
# AI回忆录（AIMemory）官网 · Nginx 站点配置
# 适用：阿里云 ECS / 轻量应用服务器（Ubuntu / CentOS）
# 用法：放到 /etc/nginx/conf.d/aimemory.cafe.conf 后 nginx -t && systemctl reload nginx
# =========================================================

# HTTP 80 → 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aimemory.cafe www.aimemory.cafe;

    # 备案校验用：阿里云可能要求 80 端口返回指定文件，留空即可
    location /.well-known/acme-challenge/ {
        root /var/www/aimemory/.well-known;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aimemory.cafe www.aimemory.cafe;

    # ---- SSL 证书路径（二选一）----
    # 1) Let's Encrypt (certbot)：
    ssl_certificate     /etc/letsencrypt/live/aimemory.cafe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aimemory.cafe/privkey.pem;
    # 2) 阿里云免费/付费证书：
    # ssl_certificate     /etc/nginx/certs/aimemory.cafe.pem;
    # ssl_certificate_key /etc/nginx/certs/aimemory.cafe.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/aimemory;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 备案稳定后可开启 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 静态资源长缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 多页面：直接命中文件；根路径兜底 index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 默认错误页
    error_page 404 /index.html;
}
